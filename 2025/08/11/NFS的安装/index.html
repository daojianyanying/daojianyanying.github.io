              <div class="markdown-body">
                
                <figure class="highlight sh"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br></pre></td><td class="code"><pre><code class="hljs sh"><span class="hljs-comment"># 服务端</span><br><span class="hljs-built_in">sudo</span> apt-get install nfs-kernel-server<br><span class="hljs-built_in">sudo</span> apt-get install nfs-common<br><br><span class="hljs-built_in">sudo</span> vim /etc/exports<br><br>/home/test *(rw,<span class="hljs-built_in">sync</span>,no_root_squash) <br>/shared_nfs *(rw,<span class="hljs-built_in">sync</span>,no_subtree_check)<br><br><span class="hljs-built_in">sudo</span> /etc/init.d/nfs-kernel-server start<br><br><span class="hljs-built_in">sudo</span> systemctl <span class="hljs-built_in">enable</span> --now nfs-kernel-server<br></code></pre></td></tr></table></figure>
<figure class="highlight sh"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br><span class="line">23</span><br><span class="line">24</span><br><span class="line">25</span><br><span class="line">26</span><br><span class="line">27</span><br><span class="line">28</span><br><span class="line">29</span><br><span class="line">30</span><br></pre></td><td class="code"><pre><code class="hljs sh"><span class="hljs-comment"># 查看NFS 支持的版本</span><br><span class="hljs-built_in">sudo</span> <span class="hljs-built_in">cat</span> /proc/fs/nfsd/versions<br><span class="hljs-comment"># nfs v4</span><br><span class="hljs-comment"># 假设我们设定的NFSv4根目录是 /srv/nfs4</span><br><span class="hljs-comment"># 我们希望共享两个目录：/export/data 和 /export/media</span><br><br><span class="hljs-comment"># 1. 创建必要的目录结构</span><br><span class="hljs-built_in">sudo</span> <span class="hljs-built_in">mkdir</span> -p /srv/nfs4/&#123;data,media&#125;<br><span class="hljs-built_in">sudo</span> <span class="hljs-built_in">mkdir</span> -p /export/data /export/media<br><br><span class="hljs-comment"># 2. 使用 mount --bind 将实际目录绑定到伪根目录下的子目录</span><br><span class="hljs-comment"># 为了使绑定在重启后依然生效，将以下内容添加到 /etc/fstab</span><br><span class="hljs-built_in">echo</span> <span class="hljs-string">&quot;/export/data /srv/nfs4/data none bind 0 0&quot;</span> | <span class="hljs-built_in">sudo</span> <span class="hljs-built_in">tee</span> -a /etc/fstab<br><span class="hljs-built_in">echo</span> <span class="hljs-string">&quot;/export/media /srv/nfs4/media none bind 0 0&quot;</span> | <span class="hljs-built_in">sudo</span> <span class="hljs-built_in">tee</span> -a /etc/fstab<br><br><span class="hljs-comment"># 立即执行绑定</span><br><span class="hljs-built_in">sudo</span> mount -a<br><br><span class="hljs-comment"># 3. 配置 /etc/exports</span><br><span class="hljs-comment"># 注意：NFSv4的配置是针对伪根目录 /srv/nfs4 进行的</span><br><span class="hljs-built_in">cat</span> &lt;&lt; <span class="hljs-string">EOF | sudo tee /etc/exports</span><br><span class="hljs-string">/srv/nfs4  *(ro,fsid=0,crossmnt,no_subtree_check,sync) # 声明伪根目录为fsid=0，只读</span><br><span class="hljs-string">/srv/nfs4/data 192.168.1.0/24(rw,sync,no_subtree_check,no_root_squash) # 对特定网段读写</span><br><span class="hljs-string">/srv/nfs4/media *.example.com(ro,sync,no_subtree_check) # 对域名example.com只读</span><br><span class="hljs-string">EOF</span><br><br><span class="hljs-comment"># 4. 导出配置并重启服务</span><br><span class="hljs-built_in">sudo</span> exportfs -arv<br><span class="hljs-built_in">sudo</span> systemctl restart nfs-server<br><br></code></pre></td></tr></table></figure>
